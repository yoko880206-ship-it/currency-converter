<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalX - 現代化極簡匯率兌換器</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Glassmorphism Styling Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }

        /* Swap Button Rotation Animation */
        .rotate-swap {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .rotate-swap:active {
            transform: rotate(180deg) scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-sky-50 to-indigo-100 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 font-sans antialiased pb-12">

    <!-- Top Navigation Bar -->
    <nav class="w-full max-w-6xl mx-auto px-4 py-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/30">
                <i data-lucide="coins" class="w-6 h-6"></i>
            </div>
            <div>
                <span class="text-xl font-bold bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-400 bg-clip-text text-transparent">GlobalX</span>
                <span class="text-xs px-2 py-0.5 ml-2 bg-sky-100 dark:bg-sky-900/50 text-sky-600 dark:text-sky-300 rounded-full font-semibold">Pro Live</span>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <!-- API Status Badge -->
            <div id="api-status-badge" class="hidden sm:flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="api-status-text">即時連線中</span>
            </div>

            <!-- Dark/Light Theme Toggle Button -->
            <button id="theme-toggle-btn" class="p-2.5 rounded-xl glass-card hover:bg-slate-200/50 dark:hover:bg-slate-800/50 transition-all text-slate-600 dark:text-slate-300" title="切換深色/淺色模式">
                <i data-lucide="sun" id="icon-sun" class="w-5 h-5 hidden"></i>
                <i data-lucide="moon" id="icon-moon" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Column: Primary Converter Card & Quick Presets (7 Cols) -->
        <section class="lg:col-span-7 flex flex-col space-y-6">
            
            <!-- Currency Converter Main Card -->
            <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 dark:shadow-none relative overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold">匯率即時算</h1>
                        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">毫秒級動態匯率換算與智慧計算</p>
                    </div>
                    <div class="text-right">
                        <span class="text-[11px] text-slate-400 block">上次更新時間</span>
                        <span id="last-updated-time" class="text-xs font-mono font-medium text-slate-600 dark:text-slate-300">更新中...</span>
                    </div>
                </div>

                <!-- Input Section: FROM -->
                <div class="space-y-2 mb-4">
                    <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">持有金額與貨幣</label>
                    <div class="flex flex-col sm:flex-row items-stretch gap-3 bg-slate-50 dark:bg-slate-900/60 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus-within:border-sky-500 dark:focus-within:border-sky-500 transition-all">
                        <!-- Flag & Currency Select -->
                        <div class="flex items-center space-x-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-xl shadow-sm border border-slate-200/80 dark:border-slate-700 min-w-[140px]">
                            <span id="from-flag" class="text-2xl">🇹🇼</span>
                            <select id="from-currency" class="bg-transparent font-bold text-sm focus:outline-none cursor-pointer w-full text-slate-800 dark:text-slate-100">
                                <!-- Generated JS options -->
                            </select>
                        </div>
                        <!-- Amount Input -->
                        <input id="from-amount" type="number" value="1000" min="0" step="any" placeholder="0.00" 
                            class="w-full bg-transparent text-right sm:text-left text-2xl font-bold font-mono focus:outline-none px-2 text-slate-800 dark:text-slate-100" />
                    </div>
                </div>

                <!-- Swap Button Controller -->
                <div class="relative flex justify-center my-2 my-0">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
                    </div>
                    <button id="swap-btn" class="rotate-swap relative z-10 w-11 h-11 rounded-full bg-gradient-to-r from-sky-500 to-indigo-600 text-white shadow-md shadow-sky-500/30 flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
                        <i data-lucide="arrow-down-up" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Input Section: TO -->
                <div class="space-y-2 mb-6">
                    <label class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">欲兌換貨幣與估算結果</label>
                    <div class="flex flex-col sm:flex-row items-stretch gap-3 bg-slate-50 dark:bg-slate-900/60 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 focus-within:border-sky-500 dark:focus-within:border-sky-500 transition-all">
                        <!-- Flag & Currency Select -->
                        <div class="flex items-center space-x-2 bg-white dark:bg-slate-800 px-3 py-2 rounded-xl shadow-sm border border-slate-200/80 dark:border-slate-700 min-w-[140px]">
                            <span id="to-flag" class="text-2xl">🇯🇵</span>
                            <select id="to-currency" class="bg-transparent font-bold text-sm focus:outline-none cursor-pointer w-full text-slate-800 dark:text-slate-100">
                                <!-- Generated JS options -->
                            </select>
                        </div>
                        <!-- Result Display Output -->
                        <input id="to-amount" type="text" readonly placeholder="0.00" 
                            class="w-full bg-transparent text-right sm:text-left text-2xl font-bold font-mono text-sky-600 dark:text-sky-400 focus:outline-none px-2 cursor-text" />
                    </div>
                </div>

                <!-- Quick Amount Modifier Buttons -->
                <div class="space-y-2">
                    <span class="text-xs text-slate-400 font-medium">常用金額調整：</span>
                    <div class="flex flex-wrap gap-2">
                        <button class="btn-quick-add px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-sky-500 hover:text-white dark:hover:bg-sky-500 text-xs font-semibold font-mono transition-all" data-amount="100">+100</button>
                        <button class="btn-quick-add px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-sky-500 hover:text-white dark:hover:bg-sky-500 text-xs font-semibold font-mono transition-all" data-amount="1000">+1,000</button>
                        <button class="btn-quick-add px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-sky-500 hover:text-white dark:hover:bg-sky-500 text-xs font-semibold font-mono transition-all" data-amount="10000">+10,000</button>
                        <button id="btn-reset-amount" class="px-3 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-semibold transition-all">重設</button>
                    </div>
                </div>

                <!-- Current Exchange Rate Info Banner -->
                <div class="mt-6 p-4 rounded-2xl bg-sky-500/10 border border-sky-500/20 flex justify-between items-center">
                    <div class="flex items-center space-x-2 text-xs sm:text-sm text-sky-700 dark:text-sky-300">
                        <i data-lucide="info" class="w-4 h-4 shrink-0"></i>
                        <span>參考匯率：<strong id="single-exchange-rate" class="font-mono font-bold">1 TWD ≈ 4.70 JPY</strong></span>
                    </div>
                    <button id="save-history-btn" class="text-xs font-semibold px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg transition-all flex items-center space-x-1">
                        <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                        <span>儲存紀錄</span>
                    </button>
                </div>
            </div>

            <!-- Historical Rate Chart Card -->
            <div class="glass-card rounded-3xl p-6 shadow-xl shadow-slate-200/50 dark:shadow-none">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                    <div>
                        <h3 class="text-base font-bold flex items-center space-x-2">
                            <i data-lucide="trending-up" class="w-4 h-4 text-sky-500"></i>
                            <span id="chart-title-text">匯率歷史走勢圖</span>
                        </h3>
                        <p class="text-xs text-slate-400">近 7 天模擬估算趨勢分析</p>
                    </div>
                    <div class="flex space-x-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-medium">
                        <button class="chart-time-btn px-2.5 py-1 rounded-lg bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-400 shadow-sm">7D</button>
                        <button class="chart-time-btn px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">1M</button>
                        <button class="chart-time-btn px-2.5 py-1 rounded-lg text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">1Y</button>
                    </div>
                </div>
                <div class="relative w-full h-56">
                    <canvas id="rateHistoryChart"></canvas>
                </div>
            </div>

        </section>

        <!-- Right Column: Quick Rates Grid & Conversion History (5 Cols) -->
        <section class="lg:col-span-5 flex flex-col space-y-6">

            <!-- Quick Rates Grid Card -->
            <div class="glass-card rounded-3xl p-6 shadow-xl shadow-slate-200/50 dark:shadow-none">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold flex items-center space-x-2">
                        <i data-lucide="globe" class="w-4 h-4 text-indigo-500"></i>
                        <span>熱門匯率速覽表</span>
                    </h3>
                    <select id="quick-base-currency" class="bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-xs font-bold px-2.5 py-1.5 focus:outline-none cursor-pointer">
                        <option value="TWD">以 TWD 為基準</option>
                        <option value="USD">以 USD 為基準</option>
                        <option value="EUR">以 EUR 為基準</option>
                    </select>
                </div>

                <!-- Grid List -->
                <div id="quick-rates-grid" class="grid grid-cols-2 gap-3">
                    <!-- Dynamic Grid Items generated by JS -->
                </div>
            </div>

            <!-- Recent History List Card -->
            <div class="glass-card rounded-3xl p-6 shadow-xl shadow-slate-200/50 dark:shadow-none flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base font-bold flex items-center space-x-2">
                        <i data-lucide="history" class="w-4 h-4 text-emerald-500"></i>
                        <span>換算與儲存紀錄</span>
                    </h3>
                    <button id="clear-history-btn" class="text-xs text-rose-500 hover:underline">清空紀錄</button>
                </div>

                <div id="history-container" class="space-y-3 max-h-72 overflow-y-auto pr-1 flex-1">
                    <!-- History entries generated by JS -->
                    <div id="empty-history-msg" class="text-center py-8 text-xs text-slate-400">
                        尚無儲存的換算紀錄
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="max-w-6xl mx-auto px-4 mt-8 text-center text-xs text-slate-400">
        <p>© 2026 GlobalX Currency Converter. 結合 API 即時動態連線與離線降級備份機制。</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // ==========================================
        // Currency Database & Supported Assets
        // ==========================================
        const CURRENCIES = {
            TWD: { name: '新台幣', flag: '🇹🇼', symbol: 'NT$' },
            USD: { name: '美元', flag: '🇺🇸', symbol: '$' },
            JPY: { name: '日圓', flag: '🇯🇵', symbol: '¥' },
            EUR: { name: '歐元', flag: '🇪🇺', symbol: '€' },
            GBP: { name: '英鎊', flag: '🇬🇧', symbol: '£' },
            AUD: { name: '澳幣', flag: '🇦🇺', symbol: 'A$' },
            CAD: { name: '加幣', flag: '🇨🇦', symbol: 'C$' },
            CHF: { name: '瑞士法郎', flag: '🇨🇭', symbol: 'CHF' },
            CNY: { name: '人民幣', flag: '🇨🇳', symbol: '¥' },
            HKD: { name: '港幣', flag: '🇭🇰', symbol: 'HK$' },
            KRW: { name: '韓元', flag: '🇰🇷', symbol: '₩' },
            SGD: { name: '新加坡幣', flag: '🇸🇬', symbol: 'S$' },
            THB: { name: '泰銖', flag: '🇹🇭', symbol: '฿' }
        };

        // Static fallback rates indexed against USD in case API is completely blocked/offline
        const FALLBACK_USD_RATES = {
            USD: 1.0,
            TWD: 31.5,
            JPY: 152.3,
            EUR: 0.92,
            GBP: 0.78,
            AUD: 1.52,
            CAD: 1.36,
            CHF: 0.88,
            CNY: 7.23,
            HKD: 7.82,
            KRW: 1350.0,
            SGD: 1.34,
            THB: 36.2
        };

        // App Global State
        let exchangeRatesUSD = { ...FALLBACK_USD_RATES };
        let historyList = [];
        let historyChart = null;

        // DOM Element Cache
        const fromSelect = document.getElementById('from-currency');
        const toSelect = document.getElementById('to-currency');
        const fromFlag = document.getElementById('from-flag');
        const toFlag = document.getElementById('to-flag');
        const fromInput = document.getElementById('from-amount');
        const toInput = document.getElementById('to-amount');
        const singleRateText = document.getElementById('single-exchange-rate');
        const swapBtn = document.getElementById('swap-btn');
        const quickGrid = document.getElementById('quick-rates-grid');
        const quickBaseSelect = document.getElementById('quick-base-currency');
        const historyContainer = document.getElementById('history-container');
        const lastUpdatedText = document.getElementById('last-updated-time');

        // ==========================================
        // Initialize Application
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            initLucideIcons();
            populateCurrencySelects();
            initTheme();
            initChart();

            // Load saved history from localStorage
            loadHistoryFromStorage();

            // Fetch live API rates
            await fetchExchangeRates();

            // Setup Event Listeners
            setupEventListeners();

            // Initial Calculate
            calculateConversion();
            renderQuickRates();
        });

        function initLucideIcons() {
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // ==========================================
        // Populate Select Dropdowns
        // ==========================================
        function populateCurrencySelects() {
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            Object.keys(CURRENCIES).forEach(code => {
                const info = CURRENCIES[code];
                const option1 = new Option(`${code} - ${info.name}`, code);
                const option2 = new Option(`${code} - ${info.name}`, code);
                fromSelect.add(option1);
                toSelect.add(option2);
            });

            // Set default selections
            fromSelect.value = 'TWD';
            toSelect.value = 'JPY';

            updateFlags();
        }

        function updateFlags() {
            const fromCode = fromSelect.value;
            const toCode = toSelect.value;
            fromFlag.textContent = CURRENCIES[fromCode]?.flag || '🌐';
            toFlag.textContent = CURRENCIES[toCode]?.flag || '🌐';
        }

        // ==========================================
        // API Connection & Fallback Logic
        // ==========================================
        async function fetchExchangeRates() {
            const apiStatusBadge = document.getElementById('api-status-badge');
            const apiStatusText = document.getElementById('api-status-text');

            try {
                // Try open exchangerate API
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                if (!res.ok) throw new Error('Network error fetching rates');
                
                const data = await res.json();
                if (data && data.rates) {
                    // Update global USD rates
                    Object.keys(CURRENCIES).forEach(code => {
                        if (data.rates[code]) {
                            exchangeRatesUSD[code] = data.rates[code];
                        }
                    });

                    lastUpdatedText.textContent = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                    apiStatusBadge.className = 'hidden sm:flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
                    apiStatusText.textContent = '即時 API 連線';
                    return;
                }
            } catch (err) {
                console.warn('API connection failed, falling back to cached default rates:', err);
                apiStatusBadge.className = 'hidden sm:flex items-center space-x-2 text-xs px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20';
                apiStatusText.textContent = '已使用預設快取匯率';
                lastUpdatedText.textContent = '預設靜態值';
            }
        }

        // Calculate Rate between any two currencies using USD as pivot
        function getCrossRate(fromCode, toCode) {
            const usdToFrom = exchangeRatesUSD[fromCode] || 1;
            const usdToTo = exchangeRatesUSD[toCode] || 1;
            return usdToTo / usdToFrom;
        }

        // ==========================================
        // Live Calculation & Rate Rendering
        // ==========================================
        function calculateConversion() {
            const amount = parseFloat(fromInput.value) || 0;
            const fromCode = fromSelect.value;
            const toCode = toSelect.value;

            const rate = getCrossRate(fromCode, toCode);
            const convertedAmount = amount * rate;

            // Format Output Number
            toInput.value = convertedAmount.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Single Rate Display
            singleRateText.textContent = `1 ${fromCode} ≈ ${rate.toFixed(4)} ${toCode}`;

            // Update Chart with new currency pair
            updateChartData(fromCode, toCode, rate);
        }

        // ==========================================
        // Event Listeners Setup
        // ==========================================
        function setupEventListeners() {
            // Live inputs
            fromInput.addEventListener('input', calculateConversion);
            fromSelect.addEventListener('change', () => {
                updateFlags();
                calculateConversion();
                renderQuickRates();
            });
            toSelect.addEventListener('change', () => {
                updateFlags();
                calculateConversion();
            });

            // Swap Button
            swapBtn.addEventListener('click', () => {
                const tempCurr = fromSelect.value;
                fromSelect.value = toSelect.value;
                toSelect.value = tempCurr;

                updateFlags();
                calculateConversion();
                renderQuickRates();
            });

            // Quick Add Amounts (+100, +1000, etc.)
            document.querySelectorAll('.btn-quick-add').forEach(btn => {
                btn.addEventListener('click', () => {
                    const add = parseFloat(btn.dataset.amount);
                    const current = parseFloat(fromInput.value) || 0;
                    fromInput.value = current + add;
                    calculateConversion();
                });
            });

            // Reset Button
            document.getElementById('btn-reset-amount').addEventListener('click', () => {
                fromInput.value = 1000;
                calculateConversion();
            });

            // Quick Base Select
            quickBaseSelect.addEventListener('change', renderQuickRates);

            // Save History Button
            document.getElementById('save-history-btn').addEventListener('click', saveCurrentToHistory);

            // Clear History Button
            document.getElementById('clear-history-btn').addEventListener('click', clearHistory);

            // Theme Toggle
            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
        }

        // ==========================================
        // Quick Rates Grid Renderer
        // ==========================================
        function renderQuickRates() {
            const base = quickBaseSelect.value;
            quickGrid.innerHTML = '';

            const popularTargets = ['USD', 'TWD', 'JPY', 'EUR', 'GBP', 'AUD', 'CNY', 'KRW'].filter(c => c !== base);

            popularTargets.slice(0, 6).forEach(target => {
                const rate = getCrossRate(base, target);
                const info = CURRENCIES[target];

                const card = document.createElement('div');
                card.className = 'p-3 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800 flex items-center justify-between hover:border-sky-500/50 transition-all cursor-pointer';
                card.onclick = () => {
                    fromSelect.value = base;
                    toSelect.value = target;
                    updateFlags();
                    calculateConversion();
                };

                card.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xl">${info.flag}</span>
                        <div>
                            <span class="text-xs font-bold block">${target}</span>
                            <span class="text-[10px] text-slate-400">${info.name}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-mono font-bold block text-slate-700 dark:text-slate-200">${rate < 0.1 ? rate.toFixed(4) : rate.toFixed(2)}</span>
                        <span class="text-[10px] text-emerald-500 font-semibold">+0.12%</span>
                    </div>
                `;
                quickGrid.appendChild(card);
            });
        }

        // ==========================================
        // History Management Logic
        // ==========================================
        function saveCurrentToHistory() {
            const fromCode = fromSelect.value;
            const toCode = toSelect.value;
            const amount = parseFloat(fromInput.value) || 0;
            const result = toInput.value;
            const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });

            const record = {
                id: Date.now(),
                fromCode,
                toCode,
                amount,
                result,
                time
            };

            historyList.unshift(record);
            if (historyList.length > 15) historyList.pop(); // Max 15 items

            saveHistoryToStorage();
            renderHistoryUI();
        }

        function renderHistoryUI() {
            const emptyMsg = document.getElementById('empty-history-msg');
            
            if (historyList.length === 0) {
                if (emptyMsg) emptyMsg.classList.remove('hidden');
                historyContainer.innerHTML = '<div id="empty-history-msg" class="text-center py-8 text-xs text-slate-400">尚無儲存的換算紀錄</div>';
                return;
            }

            historyContainer.innerHTML = '';
            historyList.forEach(item => {
                const el = document.createElement('div');
                el.className = 'p-3 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/80 dark:border-slate-800 flex items-center justify-between text-xs hover:border-sky-500/30 transition-all';
                
                const fromFlag = CURRENCIES[item.fromCode]?.flag || '';
                const toFlag = CURRENCIES[item.toCode]?.flag || '';

                el.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span>${fromFlag} ➡️ ${toFlag}</span>
                        <div>
                            <span class="font-bold text-slate-700 dark:text-slate-200">${item.amount} ${item.fromCode}</span>
                            <span class="text-[10px] text-slate-400 block">${item.time}</span>
                        </div>
                    </div>
                    <div class="text-right font-mono font-bold text-sky-600 dark:text-sky-400">
                        = ${item.result} ${item.toCode}
                    </div>
                `;
                historyContainer.appendChild(el);
            });
        }

        function saveHistoryToStorage() {
            localStorage.setItem('globalx_history', JSON.stringify(historyList));
        }

        function loadHistoryFromStorage() {
            const saved = localStorage.getItem('globalx_history');
            if (saved) {
                try {
                    historyList = JSON.parse(saved);
                    renderHistoryUI();
                } catch (e) {
                    historyList = [];
                }
            }
        }

        function clearHistory() {
            historyList = [];
            localStorage.removeItem('globalx_history');
            renderHistoryUI();
        }

        // ==========================================
        // Chart.js Historical Rate Visualization
        // ==========================================
        function initChart() {
            const ctx = document.getElementById('rateHistoryChart').getContext('2d');
            
            // Generate last 7 days labels
            const labels = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
            }

            historyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '趨勢走勢',
                        data: [1, 1, 1, 1, 1, 1, 1],
                        borderColor: '#0284c7',
                        backgroundColor: 'rgba(2, 132, 199, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.35,
                        pointBackgroundColor: '#0284c7',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleFont: { size: 12 },
                            bodyFont: { size: 12 }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: 'rgba(148, 163, 184, 0.1)' },
                            ticks: { color: '#94a3b8', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateChartData(fromCode, toCode, currentRate) {
            if (!historyChart) return;

            document.getElementById('chart-title-text').textContent = `${fromCode} / ${toCode} 歷史走勢`;

            // Simulate small random fluctuations for historical 7 days based on current real rate
            const simulatedData = [];
            for (let i = 6; i >= 0; i--) {
                const variation = (Math.random() - 0.48) * 0.02 * currentRate;
                const val = i === 0 ? currentRate : currentRate + variation;
                simulatedData.push(parseFloat(val.toFixed(4)));
            }

            historyChart.data.datasets[0].data = simulatedData;
            historyChart.update();
        }

        // ==========================================
        // Theme (Dark/Light) Switcher
        // ==========================================
        function initTheme() {
            const isDark = localStorage.getItem('globalx_theme') === 'dark' || 
                (!('globalx_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('icon-sun').classList.remove('hidden');
                document.getElementById('icon-moon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('icon-sun').classList.add('hidden');
                document.getElementById('icon-moon').classList.remove('hidden');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('globalx_theme', isDark ? 'dark' : 'light');

            document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
            document.getElementById('icon-moon').classList.toggle('hidden', isDark);
        }
    </script>
</body>
</html>
